<!-- Practice 01: Title, Script, Link & Meta Tags
Task:
Create a basic HTML5 webpage for a student portfolio.
1: Set the page title to "Student Portfolio".
2: Add UTF-8 character encoding.
3: Add a responsive viewport meta tag.
4: Link an external CSS file named "style.css".
5: Add a main heading "My Portfolio" inside the body.
6: Add a short paragraph introducing the portfolio. -->

<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>My Portfolio</h1>
    <p>Welcome to my student portfolio.</p>

</body>
</html>
