<!-- Hands-on Exercise 01: Personal Learning Page
Task:
Create a complete HTML5 webpage for a personal learning journey.
Requirements:
1: Use the correct HTML5 document structure.
2: Set the page title to "My AI Journey".
3: Add UTF-8 character encoding using a meta tag.
4: Add the responsive viewport meta tag.
5: Connect an external CSS file named "style.css" using the link tag.
6: Add an <h1> heading with the text "My AI Journey".
7: Add a paragraph explaining what you are currently learning.
8: Add JavaScript using the <script> tag.
9: The JavaScript should display an alert saying:
   "Welcome to My AI Journey!"
10: Keep the <head> and <body> sections properly organized. -->

    <!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Journey</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>My AI Journey</h1>

    <p>I am learning Artificial Intelligence and Web Development.</p>

    <script>
        alert("Welcome to My AI Journey!");
    </script>

</body>
</html>
