<!-- Practice 02: Title, Script, Link & Meta Tags
Task:
Create a webpage for learning Artificial Intelligence.
1: Set the page title to "AI Learning".
2: Add UTF-8 character encoding.
3: Add a responsive viewport meta tag.
4: Link an external CSS file named "style.css".
5: Add a heading "AI Learning".
6: Add a paragraph about learning Artificial Intelligence.
7: Add JavaScript inside the HTML file that displays a welcome alert. -->

<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Learning</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>AI Learning</h1>
    <p>I am learning Artificial Intelligence and Web Development.</p>

    <script>
        alert("Welcome to AI Learning!");
    </script>

</body>
</html>
